_ > nanoagent.plugin.v0001.ManifestConfig:
id: pogo-calculate-verifier
name: Pokémon GO IV Calculator
version: 0.1.5
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: []

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  acknowledge:
    description: Return a fixed acknowledgement
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  calculate-ivs:
    description: |-
      Calculate compatible IVs and Pokémon levels for a fresh, unchanged Pokémon from a standard
      wild, weather-boosted wild, egg, research, raid or weather-boosted raid encounter.
      Ask for species and form if relevant, encounter type, and caught CP if missing.
      Proceed with null for all unreported optional fields. Do not ask for them.
      Powered-up, evolved, traded, Shadow, purified, buddy-boosted and special event encounters
      with different rules are unsupported. A catch with no compatible spreads is a valid result.
      If a task run fails, report its error instead of repeating the same request.
    runner: agent
    tools: [acknowledge]
    reference: null
    instructions: |-
      Solve independently. Keep reasoning brief and reserve output for the submit call.
      First decide whether the caught CP is within the possible range for this encounter.
      If it is outside that range, call submit immediately with the requested pokemon and
      spreads: []. Treat the supplied CP as exact. Do not correct it or ask for optional details.
      Otherwise call submit with every compatible spread and its possible levels. If none fit,
      submit spreads: []. Always call submit before returning any prose.
